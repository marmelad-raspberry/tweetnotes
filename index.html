<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tweetnote</title>
    <link rel="preload" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="itheme.css">

    <!-- PWA y WebApp Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tweetnote">
    <link rel="icon" href="icon-192.png" sizes="192x192">
    <link rel="icon" href="icon-512.png" sizes="512x512">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="app-uninitialized">
    <div class="startup-overlay" id="startupOverlay">
        <div class="startup-card">
            <h2 id="startupTitle">Elige una carpeta</h2>
            <p id="startupMessage">Selecciona una carpeta en tu dispositivo para gestionar de forma nativa tus perfiles, hilos y multimedia sin depender del navegador.</p>
            <button class="startup-btn startup-primary" id="useStoredFolderBtn" onclick="requestStoredFolderAccess()" style="display:none;">Usar carpeta guardada</button>
            <button class="startup-btn startup-secondary" onclick="chooseStorageFolder()">Seleccionar carpeta</button>
        </div>
    </div>

    <div class="container">
        <div class="home-toolbar" id="homeToolbar">
            <div class="home-tools-wrapper">
                <button class="home-tools-btn" onclick="toggleHomeTools(event)" aria-label="Más opciones" title="Más opciones">⋮</button>
                <div class="home-tools-dropdown" id="homeToolsDropdown">
                    <div id="storageStatus" class="home-tools-status"><strong>Carpeta Activa:</strong> Ninguna</div>
                    <button class="storage-btn danger" id="clearStoredFolderBtn" onclick="forgetStoredFolder()" style="display: none;">Desconectar carpeta</button>
                </div>
            </div>
        </div>

        <div id="threadHeader" class="modal-header" style="display: none;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="close-btn" onclick="closeThreadView()">←</div>
                <h2>Post</h2>
            </div>
        </div>

        <div class="cover-photo" id="coverPhoto" style="display: none;"></div>
        
        <div class="profile-header" style="display: none;">
            <div class="profile-pic" id="profilePic"></div>
            <div class="header-actions">
                <button class="edit-profile-btn" onclick="openEditModal()">Editar perfil</button>
                <div style="position: relative;">
                    <button class="profile-dropdown-btn" onclick="toggleProfileDropdown(event)">⋮</button>
                    <div id="profileDropdown" class="post-dropdown" style="top: 42px; right: 0; min-width: 200px; z-index: 1000;">
                        <div id="profileListContainer"></div>
                        <div style="border-top: 1px solid var(--border-color); margin: 4px 0;"></div>
                        <div class="post-dropdown-item" onclick="openNewProfileModal()" style="color: var(--primary-blue);">+ Nuevo perfil</div>
                    </div>
                </div>
            </div>
            <div class="profile-info">
                <h1 class="profile-name" id="displayName">Usuario</h1>
                <p class="profile-handle" id="displayHandle">@usuario</p>
                <p class="profile-bio" id="displayBio" style="display: none;"></p>
            </div>
            <div class="profile-content-tabs" id="profileContentTabs">
                <button class="profile-content-tab active" id="profileTabPosts" onclick="switchProfileContentTab('posts')">Principal</button>
                <button class="profile-content-tab" id="profileTabReplies" onclick="switchProfileContentTab('replies')">Respuestas</button>
            </div>
        </div>

        <button class="write-post-btn-fixed" onclick="handleFloatingBtn(event)">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; fill: white;"><g><path d="M23 3c-6.62-.1-10.38 2.421-13.05 6.03C7.29 12.61 6 17.331 6 22h2c0-1.007.07-2.012.19-3H12c4.1 0 7.48-3.082 7.94-7.054C22.79 10.147 23.17 6.359 23 3zm-7 8h-1.5v2H16c.63-.016 1.2-.08 1.72-.188C16.95 15.24 14.68 17 12 17H8.55c.57-2.512 1.57-4.851 3-6.78 2.16-2.912 5.29-4.911 9.45-5.187C20.95 8.079 19.9 11 16 11zM4 9V6H1V4h3V1h2v3h3v2H6v3H4z"></path></g></svg>
        </button>

        <div class="search-page" id="searchPage">
            <div class="search-box-wrap">
                <span class="search-box-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10.5 4a6.5 6.5 0 1 0 4.056 11.582l4.431 4.432 1.414-1.414-4.432-4.431A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
                </span>
                <input id="searchInput" class="search-box" type="search" autocomplete="off" aria-label="Buscar posts o usuarios" placeholder="Buscar posts o @usuarios">
            </div>
        </div>

        <div class="feed" id="feed"></div>

        <div class="bottom-tabs">
            <div class="tab active" id="tabHome" onclick="switchTab('home')" title="Home">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V19.5C3 20.881 4.119 22 5.5 22h13c1.381 0 2.5-1.119 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696zM12 16.5c-1.933 0-3.5-1.567-3.5-3.5s1.567-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.567 3.5-3.5 3.5z"/></svg>
            </div>
            <div class="tab" id="tabSearch" onclick="switchTab('search')" title="Buscar">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M10.5 4a6.5 6.5 0 1 0 4.056 11.582l4.431 4.432 1.414-1.414-4.432-4.431A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
            </div>
            <div class="tab" id="tabProfile" onclick="switchTab('profile')" title="Perfil">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="close-btn" onclick="closeEditModal()">&times;</div>
                    <h2>Editar perfil</h2>
                </div>
                <button class="submit-btn" onclick="saveProfile()" style="background: var(--text-main); color: var(--bg-color);">Guardar</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="editName" class="input-text">
                </div>
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="editHandle" class="input-text">
                </div>
                <div class="input-group">
                    <label>Biografía</label>
                    <textarea id="editBio" class="input-textarea"></textarea>
                </div>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <label class="edit-profile-btn" style="display: inline-flex; align-items: center; cursor: pointer;">
                        📷 Cambiar Avatar
                        <input type="file" id="editProfilePic" accept="image/*" hidden>
                    </label>
                    <label class="edit-profile-btn" style="display: inline-flex; align-items: center; cursor: pointer;">
                        🖼️ Cambiar Portada
                        <input type="file" id="editCoverPic" accept="image/*" hidden>
                    </label>
                </div>
                <button id="deleteProfileBtn" class="submit-btn" style="background: #f4212e; margin-top: 20px; width: 100%; display: none;" onclick="deleteProfile()">Eliminar perfil</button>
            </div>
        </div>
    </div>

    <div class="modal" id="newProfileModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="close-btn" id="newProfileCloseBtn" onclick="closeNewProfileModal()">&times;</div>
                    <h2 id="newProfileModalTitle">Nuevo perfil</h2>
                </div>
                <button class="submit-btn" onclick="createNewProfile()" style="background: var(--text-main); color: var(--bg-color);">Crear</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="newName" class="input-text" placeholder="Ej. Juan Pérez">
                </div>
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="newHandle" class="input-text" placeholder="Ej. @juanp">
                </div>
                <div class="input-group">
                    <label>Biografía</label>
                    <textarea id="newBio" class="input-textarea"></textarea>
                </div>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <label class="edit-profile-btn" style="display: inline-flex; align-items: center; cursor: pointer;">
                        📷 Subir Avatar
                        <input type="file" id="newProfilePic" accept="image/*" hidden>
                    </label>
                    <label class="edit-profile-btn" style="display: inline-flex; align-items: center; cursor: pointer;">
                        🖼️ Subir Portada
                        <input type="file" id="newCoverPic" accept="image/*" hidden>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="postModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header" style="border: none;">
                <div class="close-btn" onclick="closePostModal()">&times;</div>
            </div>
            <div class="modal-body post-compose" style="padding-top: 0;">
                <div class="compose-avatar" id="modalComposeAvatar"></div>
                <div class="compose-input-area">
                    <div class="compose-profile-row">
                        <span class="compose-profile-label">Publicar como</span>
                        <select id="postProfileSelect" class="compose-profile-select" aria-label="Perfil con el que publicar"></select>
                    </div>
                    <div id="rtToolbar" class="rt-toolbar" style="display:none;">
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('bold');" data-cmd="bold" onclick="execCmd('bold')" title="Negrita"><b>B</b></button>
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('italic');" data-cmd="italic" onclick="execCmd('italic')" title="Cursiva"><i>I</i></button>
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('underline');" data-cmd="underline" onclick="execCmd('underline')" title="Subrayado"><u>U</u></button>
        <div class="rt-divider"></div>
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('justifyLeft');" data-cmd="justifyLeft" onclick="execCmd('justifyLeft')" title="Alinear Izquierda">⇤</button>
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('justifyCenter');" data-cmd="justifyCenter" onclick="execCmd('justifyCenter')" title="Alinear Centro">↔</button>
        <button type="button" class="rt-btn" onmousedown="event.preventDefault();" ontouchstart="event.preventDefault(); execCmd('justifyRight');" data-cmd="justifyRight" onclick="execCmd('justifyRight')" title="Alinear Derecha">⇥</button>
    </div>
    <div id="postText" class="compose-textarea" contenteditable="true" data-placeholder="¡¿Qué está pasando?!"></div>
                    <div id="postMediaPreview" class="media-grid"></div>
                </div>
            </div>
            <div class="media-actions">
                <div class="action-icons">
                    <label title="Modo Avanzado" onclick="toggleAdvancedMode()" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; fill: currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path></svg>
    </label>
    <label title="Archivos multimedia" id="mediaUploadLabel">
                        <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; fill: currentColor;"><g><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"></path></g></svg>
                        <input type="file" id="postMedia" accept="image/*, video/*" multiple hidden>
                    </label>
                </div>
                <button class="submit-btn" id="postSubmitBtn" onclick="submitPost()">Postear</button>
            </div>
        </div>
    </div>

    <div class="modal" id="imageViewerModal" onclick="if(event.target === this) closeImageViewer()">
        <button class="viewer-close-btn" onclick="closeImageViewer()">&times;</button>
        <div class="modal-content" id="imageViewerContent"></div>
    </div>

    <script src="app.js" defer></script>

    <!-- Registro del Service Worker para funcionamiento offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ ServiceWorker registrado con éxito.'))
                    .catch(err => console.log('❌ Error al registrar el ServiceWorker:', err));
            });
        }
    </script>
</body>
</html>

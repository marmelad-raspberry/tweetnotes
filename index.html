    function buildMediaGridForPost(mediaArray) {
        const mediaGrid = document.createElement('div');
        mediaGrid.className = 'media-grid';
        if (mediaArray.length <= 4) { mediaGrid.classList.add(`grid-${mediaArray.length}`); } 
        else { mediaGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(120px, 1fr))'; mediaGrid.style.gridAutoRows = '120px'; }
        const postImagesUrls = mediaArray.filter(m => !m.isVideo);
        mediaArray.forEach(media => {
            let mediaElement;
            if (media.isVideo) { 
                mediaElement = document.createElement('video'); mediaElement.controls = true; mediaElement.preload = "none";
            } else {
                mediaElement = document.createElement('img');
                const currentMedia = media;
                mediaElement.onclick = (e) => { e.stopPropagation(); openImageViewerForMedia(postImagesUrls, currentMedia); }
            }
            mediaElement.className = 'media-item lazy-media';
            if (media.ref) { mediaElement.dataset.mediaRef = JSON.stringify(media.ref); lazyMediaObserver.observe(mediaElement); }
            else if (media.url) {
                if (media.url.startsWith('data:')) { mediaElement.dataset.src = media.url; lazyMediaObserver.observe(mediaElement); }
                else mediaElement.src = media.url;
            }
            mediaGrid.appendChild(mediaElement);
        });
        return mediaGrid;
    }

    function renderPostContent(postDiv, text, mediaArray) {
        const authorId = postDiv.dataset.authorId || activeProfileId;
        const authorProfile = profiles.find(p => p.id === authorId) || profiles[0];
        if (!authorProfile) return;

        let replyCount = postDiv.dataset.replyCount || '0';
        let replyCountHtml = replyCount !== '0' ? replyCount : '';

        postDiv.innerHTML = `
            <div class="post-left-col">
                <div class="post-avatar sync-avatar profile-link" role="button" tabindex="0" aria-label="Ver perfil"></div>
                <div class="thread-line"></div>
            </div>
            <div class="post-main">
                <div class="post-header" style="justify-content: space-between; width: 100%;">
                    <div style="display: flex; gap: 4px; align-items: center;">
                        <span class="post-author sync-name profile-link" role="button" tabindex="0">${escapeHtml(authorProfile.name || 'Usuario')}</span>
                        <span class="post-handle sync-handle profile-link" role="button" tabindex="0">${escapeHtml(authorProfile.handle || '@usuario')} · Ahora</span>
                    </div>
                    <div class="post-options" style="position: relative;">
                        <button class="post-options-btn" onclick="toggleDropdown(event, this)">⋮</button>
                        <div class="post-dropdown">
                            <div class="post-dropdown-item" onclick="editPost(event, this)">Editar</div>
                            <div class="post-dropdown-item danger" onclick="deletePost(event, this)">Eliminar</div>
                        </div>
                    </div>
                </div>
                ${text ? `<p class="post-content">${renderTextWithHashtags(text)}</p>` : ''}
            </div>
        `;

        const avatarEl = postDiv.querySelector('.post-avatar');
        getProfileImage(authorProfile, 'avatar').then(url => {
            if (url) avatarEl.style.backgroundImage = `url(${url})`;
        });

        const profileTargets = postDiv.querySelectorAll('.profile-link');
        profileTargets.forEach(target => {
            const goToProfile = (event) => openProfile(authorId, event);
            target.addEventListener('click', goToProfile);
            target.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') goToProfile(event); });
        });

        const postMain = postDiv.querySelector('.post-main');
        if (mediaArray && mediaArray.length > 0) postMain.appendChild(buildMediaGridForPost(mediaArray));

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'post-actions';
        actionsDiv.innerHTML = `
            <button class="action-btn reply-btn" title="Responder" onclick="startReply(this, event)">
                <svg viewBox="0 0 24 24"><g><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></g></svg>
                <span class="reply-count-text">${replyCountHtml}</span>
            </button>
        `;
        postMain.appendChild(actionsDiv);
    }

    async function submitPost() {
        const text = document.getElementById('postText').value.trim();
        selectedMediaFiles = normalizePostMedia(selectedMediaFiles);
        const selectedProfileId = profiles.some(p => p.id === composerProfileId) ? composerProfileId : activeProfileId;
        if (!selectedProfileId || (!text && selectedMediaFiles.length === 0)) return;

        const btn = document.getElementById('postSubmitBtn');
        const origText = btn.innerText;
        btn.innerText = 'Subiendo...';
        btn.disabled = true;

        try {
            const finalMedia = [];
            for (const media of selectedMediaFiles) {
                if (media.file) {
                    const ref = await saveMedia(media.file);
                    finalMedia.push({ ref, isVideo: media.isVideo });
                } else {
                    finalMedia.push({ url: media.url, ref: media.ref, isVideo: media.isVideo });
                }
            }

            let modifiedPostId = null;

            if (editingPostElement) {
                const editingContainer = getPostContainerElement(editingPostElement);
                if (editingContainer) {
                    const threadId = editingContainer.dataset.threadId;
                    const postId = editingPostElement.dataset.id;
                    const thread = threadsData.find(t => t.id === threadId);
                    if(thread) {
                        const post = thread.posts.find(p => p.id === postId);
                        if(post) {
                            post.text = text; post.authorId = selectedProfileId; post.media = finalMedia;
                            modifiedPostId = post.id;
                        }
                    }
                }
            } else {
                const newPost = { id: 'post_' + Date.now(), text: text, authorId: selectedProfileId, replyCount: 0, media: finalMedia };
                modifiedPostId = newPost.id;
                
                if (replyingToThread) {
                    const threadId = replyingToThread.dataset.threadId;
                    const thread = threadsData.find(t => t.id === threadId);
                    if (thread) {
                        thread.posts.push(newPost);
                        if (replyingToPost) {
                            const parentId = replyingToPost.dataset.id;
                            const parent = thread.posts.find(p => p.id === parentId);
                            if (parent) { parent.replyCount++; dirtyPosts.add(parent.id); }
                        }
                    }
                } else {
                    threadsData.unshift({ id: 'thread_' + Date.now(), posts: [newPost] });
                }
            }

            dirtyThreadsIndex = true;
            if (modifiedPostId) dirtyPosts.add(modifiedPostId);
            await saveState();

            if (currentTab === 'search' && !document.body.classList.contains('in-thread-view')) renderSearchResults(document.getElementById('searchInput').value);
            else if (currentTab === 'profile' && !document.body.classList.contains('in-thread-view')) renderProfileContent();
            else renderAllFeed();
            
            if (replyingToThread && !document.body.classList.contains('in-thread-view')) {
                 const threadId = replyingToThread.dataset.threadId;
                 setTimeout(() => {
                     const updatedThreadContainer = document.querySelector(`.thread-container[data-thread-id="${threadId}"]`);
                     if(updatedThreadContainer) {
                         const firstPost = updatedThreadContainer.querySelector('.post');
                         if(firstPost) viewThread(firstPost, {target: firstPost});
                     }
                 }, 0);
            }
            btn.innerText = origText; btn.disabled = false;
            clearPostForm(); closePostModal();
        } catch(e) { btn.innerText = origText; btn.disabled = false; }
    }
    
    const searchInput = document.getElementById('searchInput');
    const debouncedSearch = debounce(function(val) {
        if (currentTab === 'search') renderSearchResults(val);
    }, 300);
    searchInput.addEventListener('input', function() { debouncedSearch(this.value); });
    searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); renderSearchResults(this.value); } });

    async function initializeApp() {
        showStartupOverlay('Cargando...');
        try {
            const storedHandle = await getStoredFolderHandle();
            if (storedHandle) {
                const hasPermission = await ensureFolderPermission(storedHandle, false);
                if (hasPermission) { await activateFolder(storedHandle); return; }
                showStartupOverlay(`Puedes volver a usar la carpeta guardada "${storedHandle.name}" o seleccionar otra.`, storedHandle);
                return;
            }
        } catch (e) { console.error(e); }
        
        storageMode = 'browser';
        await loadStateFromIndexedDB();
        await finishAppLoad();
    }

    initializeApp();
</script>
</body>
